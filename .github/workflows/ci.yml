name: CI do LynowWatch

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Testes
        run: dotnet test LynowWatch.sln -c Release
      - name: Publicação win-x64
        run: dotnet publish src/LynowWatch/LynowWatch.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o publicacao
      - name: Empacotar
        shell: pwsh
        run: |
          Copy-Item scripts/*.ps1 publicacao/
          Copy-Item exemplos/lynowwatch.json publicacao/
          Compress-Archive -Path publicacao/* -DestinationPath LynowWatch-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LynowWatch-Windows-x64
          path: LynowWatch-Windows-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LynowWatch-Windows-x64.zip
